name: PMI V2 bounded DEV evaluation

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Bounded data preflight or frozen market-intelligence experiment
        type: choice
        required: true
        options:
          - smoke
          - h1
          - h2
          - h3
          - h4
          - h7
        default: h1

permissions:
  contents: read

concurrency:
  group: pmi-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PMI_EXPERIMENT: ${{ inputs.experiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify clean source, Modal credentials and synthetic contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          test -z "$(git status --porcelain)"
          case "$PMI_EXPERIMENT" in
            h1) protocol_sha='d89003c7c956ff25a3b1602fdffdaf5cb81028c0'; protocol_path='reports/pmi_h1_protocol.md' ;;
            h2) protocol_sha='97db1f8ea813d101e3cd69008ee63e1b3add5a4a'; protocol_path='reports/pmi_h2_protocol.md' ;;
            h3) protocol_sha='72af5363ec89482d904c0c0a80e4867a1f122369'; protocol_path='reports/pmi_h3_protocol.md' ;;
            h4) protocol_sha='d83a085c00688d30a4942e80a8888ea6656064be'; protocol_path='reports/pmi_h4_protocol.md' ;;
            h7) protocol_sha='6e6008088e55d670a55378c64ea9ac48f77d0ce9'; protocol_path='reports/pmi_h7_protocol.md' ;;
            *) protocol_sha=''; protocol_path='' ;;
          esac
          if [[ -n "$protocol_sha" ]]; then
            git merge-base --is-ancestor "$protocol_sha" HEAD
            committed_sha="$(git show "${protocol_sha}:${protocol_path}" | sha256sum | cut -d' ' -f1)"
            working_sha="$(sha256sum "$protocol_path" | cut -d' ' -f1)"
            test "$committed_sha" = "$working_sha"
          fi
          python -m pip install 'modal>=1.6,<2' uv
          uv sync --frozen --dev --no-install-project
          uv run --no-sync pytest -q tests/test_pmi_smoke.py tests/test_pmi_h2_runner.py tests/test_survival_v2.py tests/test_pmi_h3.py tests/test_pmi_h4.py tests/test_intelligence_v2.py tests/test_intelligence_core.py tests/test_erf01_regime_atlas.py tests/test_erf01_regression.py tests/test_erf01_tape.py tests/test_architecture.py
      - name: Bounded selected evaluation on canonical Modal DEV tape
        shell: bash
        run: |
          set -euo pipefail
          case "$PMI_EXPERIMENT" in
            smoke) result_marker='PMI_SMOKE_RESULT='; module='smoke' ;;
            h1) result_marker='PMI_H1_RESULT=' ;;
            h2) result_marker='PMI_H2_RESULT='; module='h2' ;;
            h3) result_marker='PMI_H3_RESULT='; module='h3' ;;
            h4) result_marker='PMI_H4_RESULT='; module='h4' ;;
            h7) result_marker='PMI_H7_RESULT=' ;;
            *) echo "Unsupported experiment selection" >&2; exit 2 ;;
          esac
          if [[ "$PMI_EXPERIMENT" == "h1" || "$PMI_EXPERIMENT" == "h7" ]]; then
            module="$PMI_EXPERIMENT"
          fi
          run_path="/data/market_intelligence_v2/${PMI_EXPERIMENT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          command="python -m experiments.market_intelligence.${module} --staging /data/erf01/staging --out ${run_path} --run-url ${run_url}"
          timeout --signal=TERM --kill-after=10s 430s modal run modal_app.py --cmd "$command" 2>&1 | tee "$RUNNER_TEMP/pmi-experiment.log"
          grep -Fq "$result_marker" "$RUNNER_TEMP/pmi-experiment.log"
      - name: Collect unique Modal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          run_path="/data/market_intelligence_v2/${PMI_EXPERIMENT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p pmi-artifact
          cp "$RUNNER_TEMP/pmi-experiment.log" pmi-artifact/run.log 2>/dev/null || true
          listing="$(modal volume ls kepler-data "$run_path" 2>&1 || true)"
          if grep -Fq 'metrics.json' <<< "$listing"; then
            for file in metrics.json manifest.json predictions.jsonl sensitivity_predictions.jsonl; do
              if grep -Fq "$file" <<< "$listing"; then
                modal volume get kepler-data "${run_path}/${file}" "pmi-artifact/${file}"
              fi
            done
          else
            printf '%s\n' 'No completed Modal result files were available.' > pmi-artifact/result-status.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmi-${{ inputs.experiment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: pmi-artifact/
          if-no-files-found: warn
          retention-days: 30
