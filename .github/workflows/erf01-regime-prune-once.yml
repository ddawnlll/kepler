name: One-time archive merged ERF01 scientific branch
on:
  push:
    branches:
      - research/erf01-regime-intelligence-20261015
    paths:
      - .github/workflows/erf01-regime-prune-once.yml
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const name="research/erf01-regime-intelligence-20261015";
            const mainExpected="15a7b89d16f6ed7f98087e2b40cd0ce468df048a";
            if(context.ref!=="refs/heads/"+name) throw Error("unexpected ref");
            const main=(await github.rest.git.getRef({owner,repo,ref:"heads/main"})).data.object.sha;
            if(main!==mainExpected) throw Error("main changed; keep branch");
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:62})).data;
            if(!pr.merged||pr.base.ref!=="main") throw Error("PR62 not merged");
            const bs=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            if(JSON.stringify(bs.map(x=>x.name).sort())!==JSON.stringify(["main",name].sort())) throw Error("unexpected branch inventory");
            const head=(await github.rest.git.getRef({owner,repo,ref:"heads/"+name})).data.object.sha;
            if(head!==context.sha) throw Error("branch moved unexpectedly");
            const tagName="archive/2026-10-15/branch/"+name;
            const annotated=(await github.rest.git.createTag({owner,repo,tag:tagName,message:"Merged ERF-01 market regime atlas PR62 with full 566-test/Modal evidence; archive branch "+head,object:head,type:"commit"})).data.sha;
            await github.rest.git.createRef({owner,repo,ref:"refs/tags/"+tagName,sha:annotated});
            const pointer=(await github.rest.git.getRef({owner,repo,ref:"tags/"+tagName})).data.object;
            if(pointer.type!=="tag"||(await github.rest.git.getTag({owner,repo,tag_sha:pointer.sha})).data.object.sha!==head) throw Error("annotated tag verification failed");
            await github.rest.git.deleteRef({owner,repo,ref:"heads/"+name});
            core.info("ERF01_REGIME_BRANCH_ARCHIVED_AND_PRUNED "+head);
