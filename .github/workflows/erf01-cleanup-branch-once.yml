name: One-time archive and prune merged ERF01 issue branch
on:
  push:
    branches:
      - fix/erf01-issue56-real-gates-20261015
    paths:
      - .github/workflows/erf01-cleanup-branch-once.yml
permissions:
  contents: write
jobs:
  archive-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo}=context.repo;
            const branch="fix/erf01-issue56-real-gates-20261015";
            if(context.ref!=="refs/heads/"+branch) throw Error("unexpected branch");
            const main=(await github.rest.git.getRef({owner,repo,ref:"heads/main"})).data.object.sha;
            if(main!=="b281e6fe3d4372febc5b1ffe385ca6c70d50f30e") throw Error("main moved; abort");
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:59})).data;
            if(!pr.merged || pr.base.ref!=="main") throw Error("PR59 not merged");
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:"open",per_page:100});
            if(open.length) throw Error("unexpected open PRs");
            const bs=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            if(JSON.stringify(bs.map(x=>x.name).sort())!==JSON.stringify([branch,"main"].sort())) throw Error("unexpected branch inventory");
            const current=(await github.rest.git.getRef({owner,repo,ref:"heads/"+branch})).data.object.sha;
            if(current!==context.sha) throw Error("branch advanced; no prune");
            const name="archive/2026-10-15/branch/"+branch;
            const tag=(await github.rest.git.createTag({owner,repo,tag:name,message:"Verified ERF-01 #56 corrected branch before safe prune. Main merged PR #59 at "+main,object:current,type:"commit"})).data.sha;
            await github.rest.git.createRef({owner,repo,ref:"refs/tags/"+name,sha:tag});
            const ref=(await github.rest.git.getRef({owner,repo,ref:"tags/"+name})).data.object;
            if(ref.type!=="tag" || (await github.rest.git.getTag({owner,repo,tag_sha:ref.sha})).data.object.sha!==current) throw Error("tag verification failed");
            await github.rest.git.deleteRef({owner,repo,ref:"heads/"+branch});
            core.info("ERF01_PR59_BRANCH_ARCHIVED_AND_DELETED "+current);
