name: Temporary ERF01 research integrity and tape builder unit gate
on:
  push:
    branches: [research/erf01-evidence-readiness-20261015]
    paths: [.github/workflows/erf01-builder-test-once.yml]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev --no-install-project
      - run: |
          uv run --no-sync python tests/test_architecture.py
          uv run --no-sync python -m pytest -q tests/test_erf01_dev_tape_builder.py tests/test_erf01_edge_audit.py tests/test_erf01_regression.py
