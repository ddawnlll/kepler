name: One-time Kepler PR53+ERF integrated validation
# Final rerun after strict writer schema and full finance/identity reconciliation 2026-10-15
on:
  push:
    branches: [integration/pr53-validation-20261015]
    paths: [.github/workflows/pr53-validation-once.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproducible dependencies
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev --no-install-project
      - name: Architecture invariant
        run: uv run --no-sync python tests/test_architecture.py
      - name: Numba CPU suite + ERF-01 regressions
        env:
          NUMBA_NUM_THREADS: '2'
          KEPLER_NET: '0'
        run: uv run --no-sync pytest -q
