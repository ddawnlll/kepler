name: One-time read-only Kepler Volume layout check
on:
  push:
    branches: [integration/pr53-validation-20261015]
    paths: [.github/workflows/volume-inventory-once.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'modal>=1.6,<2'
      - name: List existing mount paths only; no remote compute or file downloads
        shell: bash
        run: |
          set -euo pipefail
          for prefix in / /tape /tape/klines /pre2022 /data; do
            echo "=== EXISTING PATH LISTING: $prefix ==="
            timeout 15s modal volume ls kepler-data "$prefix" 2>&1 | sed -n '1,20p' || true
          done
