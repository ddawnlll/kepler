name: Temporary ERF-01 issue 56 real gates
on:
  push:
    branches: [fix/erf01-issue56-real-gates-20261015]
    paths: [.github/workflows/erf01-issue56-once.yml]
permissions:
  contents: read
jobs:
  pinned-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev --no-install-project
      - run: |
          uv run --no-sync python -m py_compile scripts/erf01.py scripts/erf01_tape.py
          uv run --no-sync python tests/test_architecture.py
          uv run --no-sync pytest -q
  modal-integration-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'modal>=1.6,<2'
      - name: Check secret and read-only real DEV data inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          echo "=== Canonical DEV data (read-only check; no fake pass) ==="
          if modal volume ls kepler-data /tape/klines 2>&1 | grep -E 'BTCUSDT.parquet'; then
            echo "REAL_TAPE_FILE_LISTED; full-study gate still requires 9-symbol coverage"
          else
            echo "REAL_DEV_GATE_NOT_RUN: canonical tape missing; do not infer edge"
          fi
      - name: Run bounded CPU integration against real Parquet, genuine QC and mocked-free tape
        shell: bash
        run: |
          set -euo pipefail
          cat > erf01_remote_gates_once.py <<'PY'
          from pathlib import Path
          import modal
          
          ROOT = Path(__file__).resolve().parent
          app = modal.App("kepler-erf01-gates-once")
          image = (modal.Image.debian_slim(python_version="3.12")
              .pip_install("pytest>=8,<9", "numpy>=2,<2.3", "pandas>=2,<3",
                           "scikit-learn>=1.5,<2", "pyarrow>=17,<24",
                           "duckdb>=1,<2", "requests>=2,<3", "numba>=0.60,<0.64")
              .env({"PYTHONPATH": "/repo:/repo/scripts", "NUMBA_NUM_THREADS": "2"})
              .add_local_dir(str(ROOT / "kepler"), remote_path="/repo/kepler")
              .add_local_file(str(ROOT / "scripts/erf01.py"), remote_path="/repo/scripts/erf01.py")
              .add_local_file(str(ROOT / "scripts/erf01_tape.py"), remote_path="/repo/scripts/erf01_tape.py")
              .add_local_file(str(ROOT / "tests/test_erf01_regression.py"), remote_path="/repo/tests/test_erf01_regression.py")
              .add_local_file(str(ROOT / "tests/test_erf01_tape.py"), remote_path="/repo/tests/test_erf01_tape.py")
              .add_local_file(str(ROOT / "reports/erf01_protocol.md"), remote_path="/repo/reports/erf01_protocol.md")
          )
          @app.function(image=image, timeout=170, cpu=2, memory=4096, max_containers=1, min_containers=0)
          def remote_gate_test():
              import os, subprocess, sys, tempfile
              from datetime import date
              import numpy as np
              import pandas as pd
              from scripts.erf01_tape import load_development
              from scripts import erf01
          
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                                        "/repo/tests/test_erf01_regression.py",
                                        "/repo/tests/test_erf01_tape.py"],
                                      cwd="/repo", capture_output=True, text=True, timeout=90)
              print("REMOTE_PYTEST_OUT", result.stdout[-3000:], result.stderr[-1500:])
              if result.returncode != 0:
                  raise AssertionError("ERF01_REMOTE_REGRESSION_FAILED")
              assert erf01._ensure_protocol().is_file()
              assert erf01.SEAL == date(2026, 4, 1)
          
              with tempfile.TemporaryDirectory(prefix="erf01_real_parquet_") as root:
                  root=Path(root)
                  hours=pd.date_range("2025-01-01", periods=25, freq="h", tz="UTC")
                  values=np.full(len(hours), 100.0)
                  kl=pd.DataFrame({"ts":hours,"ts_unit":"ms","open":values,"high":values+1,
                                   "low":values-1,"close":values,"volume":np.full(len(hours),5.0)})
                  mk=kl.copy()
                  funding_times=pd.date_range("2025-01-01", periods=3, freq="8h", tz="UTC")
                  fund=pd.DataFrame({"ts":funding_times,"ts_unit":"ms",
                                     "funding_interval_hours":[8.0]*3,
                                     "last_funding_rate":[0.0001]*3})
                  def store(kind, frame):
                      p=root/"tape"/kind/"BTCUSDT.parquet"
                      p.parent.mkdir(parents=True, exist_ok=True)
                      frame.to_parquet(p,index=False)
                      return p
                  pkl=store("klines",kl); store("markPriceKlines",mk); store("fundingRate",fund)
                  a,b,fr,meta,acq=load_development(
                     root,["BTCUSDT"],date(2025,1,1),date(2025,1,3),date(2026,4,1))
                  assert list(a["BTCUSDT"])==[date(2025,1,1)],"24-complete-hours only"
                  assert len(b["BTCUSDT"])==3 and len(fr)==3
                  assert meta["BTCUSDT"]["dropped_incomplete_days"]==1
                  assert acq["record_count"]==3 and acq["complete"]
                  print("REAL_PARQUET_CANONICAL_QC_OK: 24h complete + partial discarded; funding checked")
                  kl.loc[0,"close"]=-1
                  store("klines",kl)
                  try:
                      load_development(root,["BTCUSDT"],date(2025,1,1),date(2025,1,3),date(2026,4,1))
                  except RuntimeError as exc:
                      assert "QC errors" in str(exc)
                  else:
                      raise AssertionError("QC_CORRUPTION_NOT_REJECTED")
                  pkl.unlink()
                  try:
                      load_development(root,["BTCUSDT"],date(2025,1,1),date(2025,1,3),date(2026,4,1))
                  except FileNotFoundError:
                      pass
                  else:
                      raise AssertionError("MISSING_TAPE_NOT_REJECTED")
              print("ERF01_REMOTE_SYNTHETIC_INTEGRATION_GATES_OK")
              return "ERF01_REMOTE_GATES_OK"
          
          @app.local_entrypoint()
          def main():
              print(remote_gate_test.remote())
          
          PY
          timeout --signal=TERM --kill-after=5s 205s modal run erf01_remote_gates_once.py
