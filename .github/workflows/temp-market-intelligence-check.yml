name: Temporary market-intelligence refactor validation
on:
  push:
    branches: [refactor/market-intelligence-core-20261016]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax and architecture
        run: python3 tests/test_architecture.py
      - name: Install pinned environment
        run: |
          python -m pip install uv
          uv sync --frozen --dev --no-install-project
      - name: CLI entrypoint smoke
        run: |
          uv run --no-sync python scripts/erf01.py --help
          uv run --no-sync python scripts/erf01_regime_atlas.py --help
          uv run --no-sync python -m kepler.intelligence --help
          uv run --no-sync python scripts/ensemble.py --help
      - name: Full pinned test suite
        run: uv run --no-sync pytest -q
