name: Temporary verified hourly 8-symbol canonical staging (DEV only)
on:
  push:
    branches: [research/erf01-evidence-readiness-20261015]
    paths: [.github/workflows/erf01-real-hourly-remaining-once.yml]
permissions:
  contents: read
jobs:
  verified-tape:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - shard: one
            symbols: ETHUSDT,SOLUSDT,BNBUSDT
          - shard: two
            symbols: XRPUSDT,DOGEUSDT,ADAUSDT
          - shard: three
            symbols: LINKUSDT,AVAXUSDT
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SHARD_SYMBOLS: ${{ matrix.symbols }}
      SHARD_ID: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'modal>=1.6,<2'
      - name: SHA+real QC full 1h/mark/funding staging for selected 2 or 3 symbols
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          cat > erf01_hourly_remaining_once.py <<'PY'
          import os
          from pathlib import Path
          import modal

          ROOT=Path(__file__).resolve().parent
          app=modal.App("kepler-erf01-hourly-remaining-dev-staging")
          vol=modal.Volume.from_name("kepler-data",create_if_missing=False)
          image=(modal.Image.debian_slim(python_version="3.12")
              .pip_install("numpy>=2,<2.3","pandas>=2,<3","pyarrow>=17,<24",
                           "duckdb>=1,<2","requests>=2,<3")
              .env({"PYTHONPATH":"/repo","OPENBLAS_NUM_THREADS":"1"})
              .add_local_dir(str(ROOT/"kepler"),remote_path="/repo/kepler")
              .add_local_dir(str(ROOT/"data_manifest"),remote_path="/repo/data_manifest")
              .add_local_file(str(ROOT/"scripts/erf01_dev_tape_builder.py"),
                              remote_path="/repo/scripts/erf01_dev_tape_builder.py"))
          @app.function(image=image,volumes={"/data":vol},cpu=2,memory=4096,
                        timeout=145,max_containers=1,min_containers=0)
          def build(symbols):
              import time
              from scripts.erf01_dev_tape_builder import build_symbol
              started=time.monotonic()
              result=[]
              try:
                  for sym in symbols.split(","):
                      detail=build_symbol(Path("/repo"),
                        Path("/data/erf01/hourly_raw"),
                        Path("/data/erf01/staging"),sym,workers=24)
                      print("ERF01_REAL_CANONICAL_SYMBOL_QC",detail)
                      result.append(detail)
                      vol.commit()
                  print("ERF01_REAL_CANONICAL_SHARD_SUCCESS",len(result),
                        round(time.monotonic()-started,2))
                  return result
              finally:
                  vol.commit()
          @app.local_entrypoint()
          def main():
              print("ERF01_REAL_TAPE_SHARD_RESULTS",
                    build.remote(os.environ["SHARD_SYMBOLS"]))
          PY
          timeout --signal=TERM --kill-after=5s 175s modal run erf01_hourly_remaining_once.py
