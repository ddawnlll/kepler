name: Temporary ERF-01 real-DEV numerical parity
on:
  push:
    branches: [refactor/market-intelligence-core-20261016]
permissions:
  contents: read
concurrency:
  group: kepler-refactor-real-parity
  cancel-in-progress: true
jobs:
  numerical-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed if Modal credentials are unavailable
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          python -m pip install 'modal>=1.6,<2' uv
      - name: Recompute unchanged historical DEV atlas and compare complete scientific JSON
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 510s modal run modal_app.py --cmd "python -m kepler.intelligence atlas --staging /data/erf01/staging --out /data/erf01/refactor_parity_20261016 && python tests/verify_erf01_parity.py" 2>&1 | tee "$RUNNER_TEMP/refactor-parity.log"
          grep -q 'ERF01_REFACTOR_PARITY=.*"status": "PASS"' "$RUNNER_TEMP/refactor-parity.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-real-dev-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/refactor-parity.log
          retention-days: 14
